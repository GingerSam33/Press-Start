/* ---------- Composant : boîte en carton ---------- */
function createCarton(game){
  const root=document.getElementById("carton-tpl").content.firstElementChild.cloneNode(true);
  const q=s=>root.querySelector(s), qa=s=>root.querySelectorAll(s);
  const box=q(".cbox"), closeBtn=q(".close");
  let current=game, seq=0, timers=[], isOpen=false;
  const K=reduce?.3:1;

  function bandContent(target, small){
    const lg=LOGOS[current.plateforme];
    target.replaceChildren(lg && lg.full ? el("img",{src:lg.full,alt:""}) : el("b",{textContent:pname(current.plateforme)}));
  }
  function render(g){
    current=g; root.dataset.platform=g.plateforme; root.dataset.open=PLAT[g.plateforme].open; applyPlatform(root,g.plateforme);
    const art=g.jaquetteUrl||"";
    qa(".cf-art,.cm-cover>img,.lbl>img,.cbk-art img,.cbk-shots img").forEach(i=>i.src=art);
    q(".cf-art").alt="Jaquette de "+g.titre;
    qa(".cs-title").forEach(s=>s.textContent=g.titre);
    q(".cs-name").textContent=pname(g.plateforme); q(".cf-name").textContent=pname(g.plateforme);
    q(".lbl b").textContent=g.titre; q(".cm-cover>span").textContent=g.titre;
    bandContent(q(".cf-band")); bandContent(q(".cm-band"));
    q(".now-title").textContent=g.titre+" · "+pname(g.plateforme);
    q(".act-logo-label").firstChild.textContent="Logo "+pname(g.plateforme);
    box.setAttribute("aria-label",(isOpen?"Boîte ouverte : ":"Ouvrir la boîte de ")+g.titre);
  }
  function later(fn,ms){ timers.push(setTimeout(fn,ms*K)); }
  function setState(open){
    if(open===isOpen) return; isOpen=open; const my=++seq; timers.forEach(clearTimeout); timers=[];
    box.classList.remove("tilting"); box.style.removeProperty("--rx"); box.style.removeProperty("--ry");
    box.setAttribute("aria-expanded",open); closeBtn.tabIndex=open?0:-1; box.classList.toggle("opened",open);
    q(".now-state").textContent=open?"Boîte ouverte":"Boîte fermée";
    const steps=open ? [["s1",0,true],["s2",600,true],["s3",1400,true],["s4",1950,true]]
                     : [["s4",0,false],["s3",450,false],["s2",1050,false],["s1",1800,false]];
    steps.forEach(([c,t,on])=>later(()=>{ if(my===seq) root.classList.toggle(c,on); },t));
    render(current);
  }
  root.querySelector(".cstage").addEventListener("click",e=>{
    if(e.target.closest(".close")) return; e.fromUnit=root; setState(!isOpen);
  });
  box.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); setState(!isOpen); } });
  closeBtn.addEventListener("click",e=>{ e.stopPropagation(); setState(false); box.focus(); });
  box.addEventListener("pointermove",e=>{
    if(reduce||isOpen||e.pointerType!=="mouse") return;
    const r=box.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    box.classList.add("tilting"); box.style.setProperty("--ry",(x*40)+"deg"); box.style.setProperty("--rx",(-y*16)+"deg");
  });
  box.addEventListener("pointerleave",()=>{ box.classList.remove("tilting"); box.style.removeProperty("--rx"); box.style.removeProperty("--ry"); });

  q(".act-next").addEventListener("click",()=>{ const l=DEMO[current.plateforme]||[], i=l.findIndex(g=>g.titre===current.titre); if(l.length) render(l[(i+1)%l.length]); });
  q(".act-art").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>render({...current,jaquetteUrl:r.result}); r.readAsDataURL(f); });
  q(".act-logo").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ LOGOS[current.plateforme]={full:r.result}; units.forEach(u=>u.refreshBrand()); }; r.readAsDataURL(f); });

  render(game);
  return { root, render, refreshBrand:()=>render(current), updateManual(){}, close:()=>setState(false) };
}


/* ---------- Montage Press Start : une seule boîte, données passées dans l'adresse (#{...}) ---------- */
let G={}; try{ G=JSON.parse(decodeURIComponent(location.hash.slice(1))||'{}'); }catch(x){}
const PH=G.photos||{};
const g0=Object.assign({}, (DEMO[G.plateforme||'PS4']||DEMO.PS4)[0], {tags:[]}, G);
if(PH.front) g0.jaquetteUrl=PH.front;
else if(!G.jaquetteUrl){ const words=String(g0.titre||'').toUpperCase().split(/\s+/); g0.jaquetteUrl=demoArt({sky:["#121a33","#2c4a8a"],glow:"#9fc4ff",hills:["#1a2950","#0b1226"],l1:words.slice(0,2).join(' ').slice(0,16),l2:words.slice(2).join(' ').slice(0,18)}); }
if(!G.age) g0.age='';
const brands=document.getElementById("brands");
const u = PLAT[g0.plateforme] && PLAT[g0.plateforme].family==="carton" ? createCarton(g0) : createGameCase(g0);
units.push(u); brands.append(u.root);
const R=u.root, FA=R.querySelector('.front-art'); if(!g0.age) R.classList.add('no-age');
if(PH.front){ R.classList.add('ph-front'); if(FA) FA.src=PH.front; }
if(PH.spine){ R.classList.add('ph-spine'); R.style.setProperty('--ph-spine','url("'+PH.spine+'")'); }
/* retourner la boîte pour voir le dos */
let showingBack=false, flipping=false;
const flipBtn=document.createElement('button'); flipBtn.type='button'; flipBtn.className='ps-flip'; flipBtn.textContent='↻ Voir le dos';
if(PH.back){ document.querySelector('main').append(flipBtn); }
flipBtn.addEventListener('click',e=>{
  e.stopPropagation(); if(flipping) return; u.close(); flipping=true; const st=R.querySelector('.stage'); const sp=reduce?10:260;
  st.style.transition='transform '+sp+'ms ease-in'; st.style.transform='rotateY(90deg)';
  setTimeout(()=>{ showingBack=!showingBack; R.classList.toggle('ph-back',showingBack); if(FA) FA.src=showingBack?PH.back:(PH.front||g0.jaquetteUrl);
    st.style.transition='none'; st.style.transform='rotateY(-90deg)'; void st.offsetWidth;
    st.style.transition='transform '+sp+'ms ease-out'; st.style.transform='rotateY(0deg)';
    flipBtn.textContent=showingBack?'↺ Voir le devant':'↻ Voir le dos';
    setTimeout(()=>{ st.style.transition=''; st.style.transform=''; flipping=false; },sp+20); },sp);
});
/* ouvrir la boîte remet le devant */
R.querySelector('.stage').addEventListener('click',()=>{ if(showingBack && !flipping){ showingBack=false; R.classList.remove('ph-back'); if(FA) FA.src=PH.front||g0.jaquetteUrl; flipBtn.textContent='↻ Voir le dos'; } },true);
requestAnimationFrame(()=>units.forEach(u=>u.updateManual()));
addEventListener("resize",()=>units.forEach(u=>u.updateManual()));
document.addEventListener("click",e=>{ if(e.target.closest(".disc-wrap,.disc-wrap2,.cart-wrap,button,label,input")) return; units.forEach(u=>{ if(e.fromUnit!==u.root && !u.root.contains(e.target)) u.close(); }); });
</script>
