<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boîtes de jeux interactives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ecebf7; --ink:#1d1a3a; --muted:#5d5a80; --chip:#ffffff; --chip-line:#d6d3ee;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0d0b24; --ink:#ecebff; --muted:#9a96c8; --chip:#1a1740; --chip-line:#2e2a63; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0d0b24; --ink:#ecebff; --muted:#9a96c8; --chip:#1a1740; --chip-line:#2e2a63; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;
  background-image:radial-gradient(60% 50% at 50% 35%, rgba(92,115,255,.16), transparent 70%);}
main{max-width:1400px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;align-items:center;gap:22px}
h1{font-size:1.25rem;font-weight:600;margin:0;text-align:center}
.hint{color:var(--muted);font-size:.9rem;margin:-12px 0 0;text-align:center;max-width:62ch}
:focus-visible{outline:3px solid #8fa0ff;outline-offset:3px}

.shelf{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:28px 22px;width:100%}

/* ===================== Thèmes par plateforme ===================== */
.unit{
  --w:min(220px, calc((100vw - 48px) / 2.14));
  --h:calc(var(--w) / .79);
  --sp:calc(var(--w) * .075);
  --r:calc(var(--w) * .03);
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.unit[data-platform="PS5"]{
  --p:#2f47d9; --p-hi:#5c73ff; --p-lo:#1b2a9a;
  --shade:rgba(10,18,90,.45); --shade-strong:rgba(10,20,90,.6);
  --wall-top:rgba(14,24,120,.72); --wall-hi:rgba(120,140,255,.35);
  --band-bg:#fafafa; --band-ink:#0b0b14; --band-logo:none;
  --disc-band:#f6f6f8; --disc-ink:#111; --disc-line:#c9cad6; --disc-logo:none;
}
.unit[data-platform="PS4"]{
  --p:#2063d6; --p-hi:#4d8df2; --p-lo:#1446a6;
  --shade:rgba(8,30,90,.45); --shade-strong:rgba(10,30,100,.6);
  --wall-top:rgba(12,48,135,.72); --wall-hi:rgba(120,165,255,.35);
  --band-bg:linear-gradient(180deg,#2f7fd6,#1f66c2); --band-ink:#fff; --band-logo:invert(1);
  --disc-band:linear-gradient(180deg,#2b6fd6,#1d58bd); --disc-ink:#fff; --disc-line:rgba(255,255,255,.45); --disc-logo:invert(1);
}
.unit[data-platform="PS3"]{
  --p:#dfe2e8; --p-hi:#f7f8fa; --p-lo:#b4b9c4;
  --shade:rgba(60,66,84,.3); --shade-strong:rgba(70,76,96,.35);
  --wall-top:rgba(168,174,188,.8); --wall-hi:rgba(255,255,255,.75);
  --band-bg:#121214; --band-ink:#fff; --band-logo:invert(1);
  --disc-band:#141416; --disc-ink:#fff; --disc-line:#44444c; --disc-logo:invert(1);
}

/* ===================== Scène ===================== */
.stage{position:relative;width:calc(var(--w) * 1.06);height:calc(var(--h) * 1.06);perspective:calc(var(--w) * 6);
  transition:width .95s cubic-bezier(.65,.05,.3,1)}
.unit.is-open .stage{width:calc(var(--w) * 2.06 + var(--sp))}
.case{position:absolute;top:calc(var(--h) * .03);left:calc(var(--w) * .03);width:var(--w);height:var(--h);
  transform-style:preserve-3d;transform:translateX(0px) rotateY(var(--tilt-y,0deg)) rotateX(var(--tilt-x,0deg));
  transition:transform .95s cubic-bezier(.65,.05,.3,1);cursor:pointer;border-radius:var(--r)}
.case.open{transform:translateX(calc(var(--w) + var(--sp)));cursor:default}
.case.tilting{transition:transform .25s ease-out}

.plastic{position:absolute;inset:0;border-radius:var(--r);
  background:
    linear-gradient(135deg, rgba(255,255,255,.22), transparent 30%, transparent 70%, rgba(255,255,255,.08)),
    linear-gradient(180deg, var(--p-hi), var(--p) 40%, var(--p-lo));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25), inset 0 0 calc(var(--w)*.04) var(--shade-strong);}

/* Volet arrière */
.back{position:absolute;inset:0;transform:translateZ(0);box-shadow:0 calc(var(--w)*.08) calc(var(--w)*.16) rgba(6,4,30,.45)}
.back,.back .plastic{border-radius:var(--r);transition:border-radius .15s}
.case.open .back,.case.open .back .plastic{border-radius:0 var(--r) var(--r) 0;transition:border-radius .2s .6s}
.back .rim{position:absolute;inset:calc(var(--w)*.05);border-radius:calc(var(--w)*.02);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18), inset 0 2px 8px var(--shade)}
.well{position:absolute;left:50%;top:50%;width:calc(var(--w)*.9);height:calc(var(--w)*.9);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, var(--shade) 55%, rgba(255,255,255,.1) 70%, var(--shade) 72%);
  box-shadow:inset 0 3px 10px var(--shade-strong)}
.tab{position:absolute;width:calc(var(--w)*.09);height:calc(var(--w)*.16);border-radius:calc(var(--w)*.03);
  background:linear-gradient(90deg,var(--p-hi),var(--p));box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.back .tab.r1{right:2%;top:9%;width:calc(var(--w)*.035)}.back .tab.r2{right:2%;bottom:9%;width:calc(var(--w)*.035)}

/* Disque */
.disc-wrap{position:absolute;left:50%;top:50%;width:calc(var(--w)*.8);height:calc(var(--w)*.8);transform:translate(-50%,-50%);
  border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#d9dbe6;
  box-shadow:0 6px 14px rgba(0,0,30,.45), 0 0 0 1px rgba(255,255,255,.4);will-change:transform}
.disc .disc-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.disc .band{position:absolute;left:0;right:0;bottom:0;height:27%;background:var(--disc-band);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5%}
.disc .band b{font-weight:800;font-size:calc(var(--w)*.075);letter-spacing:.04em;color:var(--disc-ink);line-height:1}
.disc .band i{display:block;height:2px;width:44%;background:var(--disc-line);margin-top:5px;border-radius:2px}
.disc .band i+i{width:32%;margin-top:4px}
.disc .band .brand img{display:block;width:auto;height:calc(var(--w)*.085);max-width:70%;margin:0 auto;filter:var(--disc-logo)}
.disc .hub{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, transparent 0 45%, rgba(255,255,255,.95) 46% 50%, rgba(200,205,225,.9) 41% 62%, rgba(255,255,255,.55) 63% 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.disc .hole{position:absolute;left:50%;top:50%;width:10.5%;height:10.5%;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--p);box-shadow:inset 0 0 4px var(--shade-strong)}
/* Ergot central du boîtier : fixe, il ne tourne pas avec le disque */
.spindle{position:absolute;left:50%;top:50%;width:14%;height:14%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;color:var(--spindle-line,rgba(190,205,255,.55));
  background:radial-gradient(circle at 40% 35%, rgba(0,0,30,.15) 0%, rgba(0,0,30,.45) 60%, rgba(0,0,20,.6) 100%), radial-gradient(circle at 40% 35%, var(--p) 0%, var(--p-lo) 70%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), inset 0 -2px 4px var(--shade-strong), 0 0 0 2px rgba(0,0,20,.25), 0 2px 4px rgba(0,0,20,.35)}
.spindle svg{display:block;width:100%;height:100%}
.unit[data-platform="PS3"]{--spindle-line:rgba(225,228,236,.6)}
.gloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:
    conic-gradient(from 200deg, transparent 0 8%, rgba(255,255,255,.35) 12%, rgba(160,200,255,.18) 16%, transparent 22% 58%, rgba(255,210,255,.22) 63%, transparent 70%),
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), transparent 45%)}
.close{position:absolute;top:calc(var(--w)*.075);right:calc(var(--w)*.075);z-index:4;font:inherit;font-size:calc(var(--w)*.05);font-weight:600;
  color:#fff;background:rgba(10,14,60,.55);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:.35em .8em;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .3s}
.case.open .close{opacity:1;pointer-events:auto;transition-delay:.7s}

/* Couverture */
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transform:translateX(0px) translateZ(var(--T)) rotateY(0deg);
  transition:transform 1.05s cubic-bezier(.6,.02,.25,1)}
.case.open .cover{transform:translateX(calc(var(--sp) * -1)) translateZ(2px) rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r)}
.front{box-shadow:0 calc(var(--w)*.08) calc(var(--w)*.18) rgba(6,4,30,.5);overflow:hidden}
/* Safari : garde le rognage arrondi et les calques stables pendant l'inclinaison au survol */
.sleeve{isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.front .plastic{border-radius:inherit}
.inside{transform:rotateY(180deg)}
.inside,.inside .plastic{border-radius:var(--r) 0 0 var(--r)}

/* Tranche du dos */
.hinge{position:absolute;top:0;bottom:0;left:calc(var(--sp) * -1);width:var(--sp);transform-origin:100% 50%;transform:scaleX(0);transition:transform 1.05s cubic-bezier(.6,.02,.25,1);pointer-events:none;
  background:linear-gradient(90deg,var(--p-lo) 0%,var(--p) 9%,var(--p-lo) 13%,var(--p) 28%,var(--p-hi) 50%,var(--p) 72%,var(--p-lo) 87%,var(--p) 91%,var(--p-lo) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), inset 0 calc(var(--w)*.025) calc(var(--w)*.03) var(--shade), inset 0 calc(var(--w)*-.025) calc(var(--w)*.03) var(--shade)}
.hinge::before,.hinge::after{content:"";position:absolute;left:22%;right:22%;height:calc(var(--w)*.05);border-radius:2px;background:var(--shade);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.hinge::before{top:calc(var(--w)*.03)}.hinge::after{bottom:calc(var(--w)*.03)}
.case.open .hinge{transform:scaleX(1)}

/* Encoches d'ouverture */
.notch{position:absolute;top:50%;width:calc(var(--w)*.055);height:calc(var(--w)*.42);transform:translateY(-50%);z-index:3;pointer-events:none;opacity:0;transition:opacity .1s 0s;
  background:linear-gradient(90deg,var(--shade-strong),var(--shade));box-shadow:inset 0 0 calc(var(--w)*.02) var(--shade-strong), 0 0 0 1px rgba(255,255,255,.2)}
.case.open .notch{opacity:1;transition:opacity .3s .6s}
.notch.nr{right:0;border-radius:100% 0 0 100% / 50% 0 0 50%}
.notch.nl{left:0;border-radius:0 100% 100% 0 / 0 50% 50% 0;background:linear-gradient(270deg,var(--shade-strong),var(--shade))}

/* Rebord intérieur (pas côté tranche) */
.wall{position:absolute;inset:0;pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.3),
    inset 0 0 0 calc(var(--w)*.024) var(--wall-top),
    inset 0 0 0 calc(var(--w)*.027) var(--wall-hi),
    inset 0 calc(var(--w)*.012) calc(var(--w)*.05) calc(var(--w)*.03) var(--shade)}
.back .wall{left:calc(var(--w)*-.08);border-radius:0 var(--r) var(--r) 0;clip-path:inset(0 0 0 calc(var(--w)*.08) round var(--r));transition:clip-path .15s}
.case.open .back .wall{clip-path:inset(0 0 0 calc(var(--w)*.08) round 0 var(--r) var(--r) 0);transition:clip-path .2s .6s}
.inside .wall{right:calc(var(--w)*-.08);border-radius:var(--r) 0 0 var(--r);clip-path:inset(0 calc(var(--w)*.08) 0 0)}

/* Jaquette avant */
.sleeve{--bh:calc((var(--h) - var(--w)*.062) * .115);--band-top:0px;--img-top:var(--bh);
  position:absolute;inset:calc(var(--w)*.032) calc(var(--w)*.03) calc(var(--w)*.03) 0;border-radius:0 calc(var(--w)*.01) calc(var(--w)*.01) 0;overflow:hidden;background:#15123a;
  box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.unit[data-platform="PS3"] .sleeve{--img-top:calc(var(--bh) * .85)}
.sleeve .top{position:absolute;left:0;right:0;top:var(--band-top);height:calc(var(--img-top) - var(--band-top));background:var(--band-bg);
  display:flex;align-items:center;padding-left:calc(var(--bh)*.21 + var(--w)*.02);z-index:1}
/* ===== Boîtier PS3 : plastique translucide, haut arrondi et dégagé au-dessus de la jaquette ===== */
.unit[data-platform="PS3"]{--rt:calc(var(--w) * .05);--top-zone:calc(var(--w) * .105)}
.unit[data-platform="PS3"] .plastic{
  background:
    linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,.22)),
    linear-gradient(180deg, rgba(247,249,252,.72), rgba(228,232,239,.55) 40%, rgba(205,211,221,.66));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75), inset 0 0 calc(var(--w)*.03) rgba(120,128,145,.3)}
.unit[data-platform="PS3"] .sleeve{inset:var(--top-zone) calc(var(--w)*.022) calc(var(--w)*.022) 0}
.unit[data-platform="PS3"] .spine{top:var(--top-zone);bottom:calc(var(--w)*.022)}
/* Zone haute en plastique dépoli, bombée */
.unit[data-platform="PS3"] .front::after{content:"";position:absolute;left:0;right:0;top:0;height:var(--top-zone);border-radius:var(--rt) var(--rt) 0 0;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.25) 35%, rgba(255,255,255,.08) 70%, rgba(140,148,166,.22) 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(130,138,156,.45)}
/* Logos moulés dans le plastique du haut (PS3) : blancs, rendus lisibles par un jeu d'ombre */
.ps3-top{display:none}
.unit[data-platform="PS3"] .ps3-top{display:block;position:absolute;left:0;right:0;top:0;height:var(--top-zone);z-index:3;pointer-events:none}
.emb{position:absolute;display:block}
.emb i,.emb::before,.emb::after{position:absolute;left:0;width:100%;height:100%;-webkit-mask:var(--m) 0 0/100% 100% no-repeat;mask:var(--m) 0 0/100% 100% no-repeat}
.emb::before{content:"";top:-1px;background:rgba(70,78,98,.6)}
.emb::after{content:"";top:1px;background:rgba(255,255,255,.95)}

/* Boîte ouverte : la zone haute translucide laisse voir les logos moulés, à l'envers vus de l'intérieur */
.unit[data-platform="PS3"] .ps3-top-in{transform:scaleX(-1);border-radius:0 var(--rt) 0 0;
  background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.18) 45%, rgba(140,148,166,.16) 100%);
  box-shadow:inset 0 -1px 0 rgba(130,138,156,.45)}
/* ===== Édition Platinum PS3 : boîtier gris, bandeau jaune et bande latérale jaune ===== */
.plat-strip{display:none}
.unit[data-platform="PS3"][data-edition="platinum"]{
  --p:#7c8189; --p-hi:#a2a7ae; --p-lo:#5b6068;
  --shade:rgba(25,28,36,.35); --shade-strong:rgba(25,28,36,.5);
  --wall-top:rgba(78,83,92,.92); --wall-hi:rgba(200,205,212,.5);
  --plat-yellow:#f4d20f;
  --disc-band:#f4d20f; --disc-ink:#141414; --disc-line:rgba(0,0,0,.3); --disc-logo:none;
}
/* Disques PS3 : la bande du bas a un bord supérieur arrondi (noire, ou jaune en Platinum) */
.unit[data-platform="PS3"] .disc .band{height:31%;padding-top:7%;border-radius:50% 50% 0 0 / 34% 34% 0 0}
.unit[data-platform="PS3"][data-edition="platinum"] .plastic{
  background:
    linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,.06) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,.1)),
    linear-gradient(180deg, #8d9299, #767b83 40%, #5f646c);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3), inset 0 0 calc(var(--w)*.03) rgba(20,22,28,.4)}
.unit[data-platform="PS3"][data-edition="platinum"] .front::after{background:linear-gradient(180deg, rgba(255,255,255,.3) 0%, rgba(255,255,255,.08) 40%, rgba(20,22,28,.18) 100%)}
.unit[data-platform="PS3"][data-edition="platinum"] .sleeve{--img-top:var(--bh);background:linear-gradient(180deg,#888d94,#666b73)}
.unit[data-platform="PS3"][data-edition="platinum"] .sleeve .top{left:calc(var(--w)*.105);right:auto;width:calc(100% - var(--w)*.13);overflow:hidden;top:0;height:calc(var(--bh) + var(--w)*.035);border-radius:0;padding:0 0 calc(var(--w)*.035);justify-content:center;background:var(--plat-yellow)}
.unit[data-platform="PS3"][data-edition="platinum"] .sleeve .front-art{left:calc(var(--w)*.105);right:auto;bottom:auto;width:calc(100% - var(--w)*.13);height:calc(100% - var(--img-top) - var(--w)*.065);z-index:2;
  border-radius:calc(var(--w)*.035) calc(var(--w)*.035) calc(var(--w)*.06) calc(var(--w)*.06)}
.unit[data-platform="PS3"][data-edition="platinum"] .age{left:calc(var(--w)*.14);bottom:calc(var(--w)*.095);z-index:4}
/* Platinum : la jaquette semble légèrement en retrait dans le boîtier (gauche, droite, bas) */
.unit[data-platform="PS3"][data-edition="platinum"] .sleeve::after{content:"";position:absolute;z-index:3;pointer-events:none;
  left:calc(var(--w)*.105);top:0;width:calc(100% - var(--w)*.13);bottom:calc(var(--w)*.065);
  border-radius:0 0 calc(var(--w)*.06) calc(var(--w)*.06);
  box-shadow:
    inset calc(var(--w)*.012) 0 calc(var(--w)*.014) calc(var(--w)*-.004) rgba(0,0,0,.58),
    inset calc(var(--w)*-.012) 0 calc(var(--w)*.014) calc(var(--w)*-.004) rgba(0,0,0,.52),
    inset 0 calc(var(--w)*-.012) calc(var(--w)*.016) calc(var(--w)*-.004) rgba(0,0,0,.58),
    calc(var(--w)*-.003) 0 0 rgba(0,0,0,.32),
    calc(var(--w)*.003) 0 0 rgba(255,255,255,.18),
    0 calc(var(--w)*.004) 0 rgba(255,255,255,.22)}
/* PS3 classique : liseré rouge sous le bandeau noir */
.unit[data-platform="PS3"]:not([data-edition="platinum"]) .sleeve .top{box-shadow:0 calc(var(--w)*.007) 0 #d4121f}
.plat{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#141414;text-align:center;width:100%}
.sleeve .top .plat b{font-weight:800;font-size:calc(var(--bh)*.4);letter-spacing:.14em;margin-right:-.14em;color:#141414}
.sleeve .top .plat span{color:#141414;font-weight:600;font-size:calc(var(--bh)*.155);letter-spacing:.01em;margin-top:calc(var(--bh)*.08);white-space:nowrap}
.unit[data-platform="PS3"][data-edition="platinum"] .plat-strip{display:block;position:absolute;left:0;top:0;bottom:0;width:calc(var(--w)*.075);z-index:1;
  background:linear-gradient(90deg,#e2bf06,var(--plat-yellow) 40%,#f7dc2a)}
.plat-ico{position:absolute;left:0;right:0;top:0;height:calc(var(--w)*.075);background:#151515;display:flex;align-items:center;justify-content:center}

/* Coins du haut plus arrondis */
.unit[data-platform="PS3"] .front{border-radius:var(--rt) var(--rt) var(--r) var(--r)}
.unit[data-platform="PS3"] .back,.unit[data-platform="PS3"] .back .plastic{border-radius:var(--rt) var(--rt) var(--r) var(--r)}
.unit[data-platform="PS3"] .case.open .back,.unit[data-platform="PS3"] .case.open .back .plastic{border-radius:0 var(--rt) var(--r) 0}
.unit[data-platform="PS3"] .back .wall{border-radius:0 var(--rt) var(--r) 0;clip-path:inset(0 0 0 calc(var(--w)*.08) round var(--rt) var(--rt) var(--r) var(--r))}
.unit[data-platform="PS3"] .case.open .back .wall{clip-path:inset(0 0 0 calc(var(--w)*.08) round 0 var(--rt) var(--r) 0)}
.unit[data-platform="PS3"] .inside,.unit[data-platform="PS3"] .inside .plastic,.unit[data-platform="PS3"] .inside .wall{border-radius:var(--rt) 0 0 var(--r)}
.sleeve .top b{font-weight:800;font-size:calc(var(--bh)*.42);letter-spacing:.05em;color:var(--band-ink);line-height:1}
.sleeve .top img{display:block;width:auto;height:52%;max-width:62%;filter:var(--band-logo)}
.sleeve .top img.ico{height:calc(var(--bh)*.54);max-width:none}
.sleeve .top img.wm{height:calc(var(--bh)*.30);max-width:none;margin-left:calc(var(--bh)*.18)}
.sleeve .front-art{position:absolute;left:0;right:0;bottom:0;top:var(--img-top);width:100%;height:calc(100% - var(--img-top));object-fit:cover;transition:opacity .35s}
.age{position:absolute;left:7%;bottom:4%;width:calc(var(--w)*.12);height:calc(var(--w)*.14);border-radius:3px;background:#f2b51c;color:#1b1300;z-index:1;
  font-weight:800;font-size:calc(var(--w)*.07);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
/* Reflet au survol : déplacé par transform, sans redessiner la jaquette (les logos ne bougent pas) */
.sheen{position:absolute;top:0;bottom:0;left:0;width:300%;pointer-events:none;z-index:5;
  background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.16) 50%, transparent 58%);
  transform:translateX(-66.67%);transition:transform .8s;will-change:transform}
.case:not(.open):hover .sheen{transform:translateX(0)}
.spine{position:absolute;left:0;top:calc(var(--w)*.032);bottom:calc(var(--w)*.03);width:calc(var(--w)*.05);pointer-events:none;z-index:2;
  background:linear-gradient(90deg, rgba(0,0,20,.42) 0%, rgba(0,0,20,.12) 16%, rgba(255,255,255,.38) 30%, rgba(255,255,255,.1) 48%, rgba(0,0,20,.1) 66%, rgba(0,0,0,0) 100%);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.35)}

/* Intérieur de couverture : livret + tags */

.unit[data-platform="PSP"] .umd-shell span b{font:700 calc(var(--w)*.06)/1 "Helvetica Neue",Arial,sans-serif;color:#1d3f8f;letter-spacing:.02em}
.unit[data-platform="PSP"] .umd-shell span i{font:500 calc(var(--w)*.012)/1.2 "Helvetica Neue",Arial,sans-serif;font-style:normal;color:#1d3f8f;margin-top:4%;white-space:nowrap}
.unit[data-platform="PSP"] .umd-shell::before{content:"PSP";position:absolute;left:9%;bottom:6%;font:600 italic calc(var(--w)*.035)/1 "Helvetica Neue",Arial,sans-serif;color:#8d9096;letter-spacing:.08em}
.unit[data-platform="PSP"] .umd-shell::after{content:"";position:absolute;right:9%;bottom:6%;width:calc(var(--w)*.05);height:calc(var(--w)*.025);border-radius:calc(var(--w)*.006);border:1px solid #9a9da3}
.unit[data-platform="PSP"] .disc::before{display:none}
/* ===== UMD : design fourni (fenêtre cerclée de métal, étiquette UMD, logos PSP, manette) ===== */
.umd-psp{display:none}
.unit[data-platform="PSP"] .umd-shell{width:calc(var(--w)*.62);height:calc(var(--w)*.646);transform:translate(-50%,-48%);
  border-radius:50% 50% 50% 50% / 47% 47% 14.5% 14.5%;
  background:radial-gradient(circle calc(var(--w)*.287) at 50% 48%,transparent 93%,#5f6268 93.6%,#cfd2d6 95.6%,#9a9da2 97.6%,#e9eaec 99%,#f7f7f5 100%);
  box-shadow:0 calc(var(--w)*.008) calc(var(--w)*.02) rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.08),inset 0 calc(var(--w)*-.012) calc(var(--w)*.02) rgba(0,0,0,.05)}
.unit[data-platform="PSP"] .umd-shell span{top:48%;width:calc(var(--w)*.205);height:calc(var(--w)*.205);box-shadow:none}
.unit[data-platform="PSP"] .umd-shell span b{font:400 calc(var(--w)*.068)/1 "Segoe UI","Helvetica Neue",Arial,sans-serif;color:#3b1d72;letter-spacing:0}
.unit[data-platform="PSP"] .umd-shell span i{font:400 calc(var(--w)*.0135)/1.2 "Segoe UI","Helvetica Neue",Arial,sans-serif;color:#3b1d72;letter-spacing:.02em;margin-top:6%}
.unit[data-platform="PSP"] .umd-shell::before{content:"";left:7%;bottom:15%;width:calc(var(--w)*.1);height:calc(var(--w)*.0175);background:#a5a8ae;
  -webkit-mask:var(--psp-wm) 0 0/100% 100% no-repeat;mask:var(--psp-wm) 0 0/100% 100% no-repeat;font:0/0 a}
.unit[data-platform="PSP"] .umd-shell::after{right:7%;bottom:14%;width:calc(var(--w)*.065);height:calc(var(--w)*.04);border:0;border-radius:0;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2040%22%3E%3Cpath%20fill%3D%22%23a9abb2%22%20d%3D%22M14%202h36c7%200%2011%205%2012%2012l2%2016c1%206-3%2010-8%2010-4%200-6-2-8-6l-3-6H19l-3%206c-2%204-4%206-8%206-5%200-9-4-8-10l2-16C3%207%207%202%2014%202z%22/%3E%3C/svg%3E") center/contain no-repeat}
.unit[data-platform="PSP"] .umd-psp{display:block;position:absolute;left:50%;bottom:7%;width:24%;height:auto;transform:translateX(-50%);filter:invert(1);z-index:2}
.unit[data-platform="PSP"] .disc{box-shadow:none}
/* Support du UMD ajusté à la coque : même silhouette, un peu plus grand tout autour */
.unit[data-platform="PSP"] .umd-holder{top:45%;width:calc(var(--w)*.68);height:calc(var(--w)*.706);transform:translate(-50%,-48.2%);
  border-radius:50% 50% 50% 50% / 47% 47% 14.5% 14.5%}

/* =====================================================================
   NOUVELLES PLATEFORMES
   Dimensions réelles (mm) dans la table PLAT du script : --w, --h, --T sont
   calculés à partir de la même échelle que les boîtes PlayStation (135 mm = --base).
   ===================================================================== */
.unit{--base:min(220px, calc((100vw - 48px) / 2.14))}
.brand-sec{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.brand-sec h2{font-size:1rem;font-weight:600;color:var(--muted);margin:22px 0 0;letter-spacing:.01em}
.brand-sec:first-child h2{margin-top:0}

/* ---------- Boîtiers plastique (même ouverture que PS2 à PS5) ---------- */
.unit[data-family]:not([data-family="carton"]){
  --p-hi:color-mix(in srgb,var(--p) 68%,#fff);
  --p-lo:color-mix(in srgb,var(--p) 70%,#000);
  --shade:color-mix(in srgb,var(--p-lo) 55%,transparent);
  --shade-strong:color-mix(in srgb,var(--p-lo) 78%,transparent);
  --wall-top:color-mix(in srgb,var(--p-lo) 85%,transparent);
  --wall-hi:color-mix(in srgb,var(--p-hi) 45%,transparent);
  --disc-band:var(--band-bg); --disc-ink:var(--band-ink); --disc-logo:var(--band-logo);
  --disc-line:color-mix(in srgb,var(--band-ink) 40%,transparent);
}
/* Plastique transparent (Vita, DS, 3DS, Dreamcast, Saturn, Neo Geo Pocket) */
.unit[data-clear="1"] .plastic{
  background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.12) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.22)),
             linear-gradient(180deg,rgba(247,249,252,.72),rgba(228,232,239,.55) 40%,rgba(205,211,221,.66));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 0 0 calc(var(--w)*.03) rgba(120,128,145,.3)}
/* Xbox 360 : vert translucide */
.unit[data-platform="X360"] .plastic{
  background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.06) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.14)),
             linear-gradient(180deg,rgba(132,201,82,.92),rgba(98,176,52,.88) 45%,rgba(70,140,34,.92))}
/* Ergot central neutre (le dessin triangulaire reste réservé aux boîtiers PlayStation) */
.unit[data-family] .spindle svg{display:none}
.unit[data-family] .disc-wrap{width:var(--disc,calc(var(--w)*.8));height:var(--disc,calc(var(--w)*.8))}
.unit[data-family] .well{width:calc(var(--disc,calc(var(--w)*.8)) * 1.12);height:calc(var(--disc,calc(var(--w)*.8)) * 1.12)}
.unit[data-family] .disc .band b{font-size:calc(var(--disc,calc(var(--w)*.8)) * .085);white-space:nowrap}
/* Mini-disque GameCube : bande plus fine, trou plus large */
.unit[data-platform="GC"] .disc .band{height:22%}
.unit[data-platform="GC"] .disc .hub{width:36%;height:36%}
/* Dos des nouvelles plateformes : couleur du bandeau, titre lisible */
.unit[data-family]:not([data-family="carton"]) .e-spine{background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 40%,rgba(0,0,0,.18)),var(--band-bg)}
.unit[data-family]:not([data-family="carton"]) .e-band{background:rgba(0,0,0,.12)}
.unit[data-family]:not([data-family="carton"]) .e-title{color:var(--band-ink)}
.unit[data-family] .e-ico:not([src]){display:none}
/* Jewel case (Dreamcast, Saturn) : coins plus vifs */
.unit:is([data-platform="DC"],[data-platform="SATURN"]) .sleeve{inset:calc(var(--w)*.025) calc(var(--w)*.025) calc(var(--w)*.025) 0}

/* ---------- Boîtiers à cartouche : logement + cartouche qui se soulève au clic ---------- */
.cart-wrap{display:none}
.unit[data-family="cart"] :is(.well,.disc-wrap){display:none}
.unit[data-family="cart"] .cart-wrap{display:block;position:absolute;left:50%;top:var(--cart-y,50%);width:var(--Cw);height:var(--Ch);
  transform:translate(-50%,-50%);cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.cart-wrap .bay{position:absolute;inset:calc(var(--w)*-.022);border-radius:calc(var(--w)*.02);background:var(--shade);
  box-shadow:inset 0 2px 6px var(--shade-strong),0 0 0 1px rgba(255,255,255,.22)}
.cart-wrap .cart{transition:transform .55s cubic-bezier(.3,.7,.2,1.15),box-shadow .55s}
.cart-wrap.lifted .cart{transform:translateY(-26%) rotate(-5deg) scale(1.05);box-shadow:0 calc(var(--w)*.05) calc(var(--w)*.08) rgba(0,0,20,.45)}

/* ---------- Cartouches (communes aux boîtiers plastique et carton) ---------- */
.cart{position:absolute;inset:0;background:var(--cc,#888);border-radius:var(--crad,5%);overflow:hidden;clip-path:var(--cclip,none);
  box-shadow:0 3px 8px rgba(0,0,20,.4),inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -3px 6px rgba(0,0,0,.25)}
.cart::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 35%,transparent 70%,rgba(255,255,255,.06))}
.cart .lbl{position:absolute;left:var(--ll,12%);right:var(--lr,12%);top:var(--lt,10%);bottom:var(--lb,30%);border-radius:var(--lrad,3px);overflow:hidden;background:#1d1a3a;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08)}
.cart .lbl img{width:100%;height:100%;object-fit:cover;display:block}
.cart .lbl b{position:absolute;left:0;right:0;bottom:0;padding:.35em .5em;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;
  font:600 var(--lfs,9px)/1.15 Sora,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart .grip{position:absolute;left:var(--gl,8%);right:var(--gl,8%);top:var(--gt,auto);bottom:var(--gb,5%);height:var(--gh,0%);border-radius:2px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.32) 0 1.5px,rgba(255,255,255,.07) 1.5px 4px)}
/* Formes par cartouche */
[data-cart="nes"]  {--cc:#8f8f92;--crad:3%;--lt:7%;--lb:36%;--ll:10%;--lr:10%;--gh:24%;--gb:5%}
[data-cart="snes"] {--cc:#a5a5ac;--crad:20% 20% 5% 5% / 28% 28% 5% 5%;--lt:16%;--lb:18%;--ll:19%;--lr:19%;--gh:0%}
[data-cart="snes"] .cart::before{content:"";position:absolute;inset:18% 4%;background:
  repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1.5px,transparent 1.5px 4px) left/12% 100% no-repeat,
  repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 1.5px,transparent 1.5px 4px) right/12% 100% no-repeat}
[data-cart="n64"]  {--cc:#56575c;--cclip:polygon(0 0,100% 0,100% 62%,93% 70%,93% 100%,7% 100%,7% 70%,0 62%);--crad:4%;--lt:8%;--lb:34%;--ll:12%;--lr:12%;--gh:16%;--gb:6%;--gl:12%}
[data-cart="gb"]   {--cc:#bdbbb6;--cclip:polygon(0 0,86% 0,100% 8%,100% 100%,0 100%);--crad:4% 4% 6% 6%;--lt:24%;--lb:10%;--ll:10%;--lr:10%;--gh:12%;--gt:5%;--gb:auto}
[data-cart="gbc"]  {--cc:#2d2d33;--cclip:polygon(0 0,86% 0,100% 8%,100% 100%,0 100%);--crad:4% 4% 6% 6%;--lt:24%;--lb:10%;--ll:10%;--lr:10%;--gh:12%;--gt:5%;--gb:auto}
[data-cart="gba"]  {--cc:#7b7d85;--crad:16% 16% 6% 6% / 26% 26% 6% 6%;--lt:20%;--lb:16%;--ll:21%;--lr:21%;--gh:0%}
[data-cart="gg"]   {--cc:#1f1f23;--crad:8% 8% 4% 4%;--lt:12%;--lb:28%;--ll:10%;--lr:10%;--gh:16%;--gb:6%}
[data-cart="a2600"]{--cc:#1a1a1b;--crad:6% 6% 3% 3%;--lt:6%;--lb:50%;--ll:9%;--lr:9%;--gh:38%;--gb:4%}
[data-cart="a7800"]{--cc:#26262a;--crad:6% 6% 3% 3%;--lt:6%;--lb:46%;--ll:9%;--lr:9%;--gh:34%;--gb:4%}
[data-cart="aes"]  {--cc:#141415;--crad:3%;--lt:16%;--lb:10%;--ll:9%;--lr:9%;--gh:9%;--gt:3%;--gb:auto}
[data-cart="md"]   {--cc:#1c1c1e;--cclip:polygon(5% 0,95% 0,100% 5%,100% 100%,0 100%,0 5%);--crad:2%;--lt:8%;--lb:38%;--ll:9%;--lr:9%;--gh:26%;--gb:5%}
[data-cart="sms"]  {--cc:#1d1d20;--crad:3%;--lt:8%;--lb:32%;--ll:8%;--lr:8%;--gh:20%;--gb:5%}
[data-cart="ngp"]  {--cc:#202024;--crad:10% 10% 6% 6%;--lt:10%;--lb:22%;--ll:11%;--lr:11%;--gh:10%;--gb:5%}
[data-cart="ngpc"] {--cc:#40506e;--crad:10% 10% 6% 6%;--lt:10%;--lb:22%;--ll:11%;--lr:11%;--gh:10%;--gb:5%}
[data-cart="ever"] {--cc:#c92f36;--crad:10% 10% 4% 4%;--lt:8%;--lb:24%;--ll:9%;--lr:9%;--gh:12%;--gb:5%}
[data-cart="sw"]   {--cc:#2b2b30;--crad:12%;--lt:8%;--lb:26%;--ll:9%;--lr:9%;--lrad:2px}
[data-cart="sw2"]  {--cc:#c8121c;--crad:12%;--lt:8%;--lb:26%;--ll:9%;--lr:9%;--lrad:2px}
[data-cart="ds"]   {--cc:#3b3b41;--cclip:polygon(0 0,100% 0,100% 100%,8% 100%,0 92%);--crad:6%;--lt:20%;--lb:8%;--ll:8%;--lr:8%;--gh:8%;--gt:5%;--gb:auto}
[data-cart="3ds"]  {--cc:#ececee;--cclip:polygon(0 0,100% 0,100% 100%,8% 100%,0 92%);--crad:6%;--lt:20%;--lb:8%;--ll:8%;--lr:8%;--gh:8%;--gt:5%;--gb:auto}
[data-cart="vita"] {--cc:#1c1c1f;--crad:8%;--lt:8%;--lb:22%;--ll:9%;--lr:9%;--lrad:2px}
[data-small="1"] .cart .lbl b{display:none}
[data-cart="3ds"] .cart .grip{background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 1.5px,transparent 1.5px 4px)}

/* ===================== Boîtes en carton (NES, SNES, N64, Game Boy, Atari, Neo Geo…) ===================== */
.unit[data-family="carton"]{--gap:calc(var(--w) * .1)}
.cstage{position:relative;width:var(--w);height:var(--h);perspective:calc(var(--w) * 5.5);
  transition:width .75s cubic-bezier(.65,.05,.3,1),height .75s cubic-bezier(.65,.05,.3,1)}
.unit[data-family="carton"].s1 .cstage{width:calc(var(--w) * 2 + var(--gap))}
.unit[data-family="carton"][data-open="top"].s1 .cstage{height:calc(var(--h) + var(--Fh) + var(--gap))}
.unit[data-family="carton"][data-open="right"].s1 .cstage{height:calc(var(--h) * 2 + var(--gap))}

.cbox{position:absolute;left:0;top:0;width:var(--w);height:var(--h);transform-style:preserve-3d;cursor:pointer;
  transform-origin:50% 50% calc(var(--T) / 2);
  transform:translateY(var(--oy,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .75s cubic-bezier(.6,.05,.25,1);-webkit-tap-highlight-color:transparent}
.cbox.tilting{transition:transform .25s ease-out}
.cbox:focus-visible{outline:3px solid #8fa0ff;outline-offset:4px}
.cb{position:absolute;transform-style:preserve-3d}
/* Faces : dos à z=0, face avant à z=T */
.cb-front{inset:0;transform:translateZ(var(--T));background:var(--box);overflow:hidden;border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 calc(var(--w)*.06) calc(var(--w)*.15) rgba(6,4,30,.45)}
.cb-back{inset:0;transform:rotateY(180deg);background:var(--box);overflow:hidden;border-radius:2px;backface-visibility:visible}
.cb-inner{inset:0;transform:translateZ(1px);background:linear-gradient(180deg,#9b8564,#b9a27c 40%,#a68f6a);box-shadow:inset 0 0 calc(var(--w)*.08) rgba(40,26,10,.55)}
.cb-left{left:0;top:0;width:var(--T);height:100%;transform-origin:0 50%;transform:rotateY(-90deg)}
.cb-right{left:calc(var(--w) - var(--T));top:0;width:var(--T);height:100%;transform-origin:100% 50%;transform:rotateY(90deg);transition:transform .6s cubic-bezier(.5,.05,.3,1)}
.cb-top{left:0;top:0;width:100%;height:var(--T);transform-origin:50% 0;transform:rotateX(90deg);transition:transform .6s cubic-bezier(.5,.05,.3,1)}
.cb-bottom{left:0;top:calc(var(--h) - var(--T));width:100%;height:var(--T);transform-origin:50% 100%;transform:rotateX(-90deg)}
.cb-left,.cb-bottom{background:var(--band-bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 calc(var(--T)*.4) rgba(0,0,0,.3)}
/* Rabats (dessus et côté droit) : extérieur imprimé, intérieur en carton brut */
.cb-out,.cb-in{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.cb-out{background:var(--band-bg);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 calc(var(--T)*.4) rgba(0,0,0,.28)}
.cb-top .cb-in{transform:rotateX(180deg)}
.cb-right .cb-in{transform:rotateY(180deg)}
.cb-in{background:linear-gradient(180deg,#c8b28a,#ad966f);box-shadow:inset 0 0 0 1px rgba(60,40,15,.35)}
.cs-title{font:600 calc(var(--T)*.36)/1 Sora,system-ui,sans-serif;color:var(--band-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%}
.cb-left{display:flex;flex-direction:column;align-items:center;gap:calc(var(--w)*.03);padding:calc(var(--w)*.04) 0;overflow:hidden}
.cb-left .cs-title,.cb-left .cs-name{writing-mode:vertical-rl;max-width:none;max-height:100%}
.cb-left .cs-name{font:800 calc(var(--T)*.34)/1 Sora,system-ui,sans-serif;color:var(--band-ink);opacity:.75;white-space:nowrap}
.cb-right .cs-title{writing-mode:vertical-rl;max-height:92%;max-width:none}

/* Façade : bandeau console + illustration encadrée */
.cf-band{position:absolute;left:0;right:0;top:0;height:var(--bandh,13%);background:var(--band-bg);display:flex;align-items:center;padding:0 calc(var(--w)*.06);z-index:1;
  box-shadow:0 calc(var(--w)*.006) 0 var(--band-line,rgba(255,255,255,.25))}
.cf-band b{font:800 calc(var(--w)*.064)/1 Sora,system-ui,sans-serif;color:var(--band-ink);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-band img{display:block;height:58%;width:auto;max-width:70%;filter:var(--band-logo)}
.unit[data-open="right"] .cf-band{height:var(--bandh,15%)}
.cf-art{position:absolute;left:var(--frame,5%);right:var(--frame,5%);top:calc(var(--bandh,13%) + var(--frame-t,3%));bottom:var(--frame,5%);
  width:calc(100% - var(--frame,5%) * 2);height:calc(100% - var(--bandh,13%) - var(--frame-t,3%) - var(--frame,5%));object-fit:cover;display:block;
  box-shadow:0 0 0 1px rgba(255,255,255,.15),0 0 0 calc(var(--w)*.006) rgba(0,0,0,.5);transition:opacity .35s}
.unit[data-open="right"] .cf-art{object-position:center 30%;top:calc(var(--bandh,15%) + 4%);height:calc(100% - var(--bandh,15%) - 4% - var(--frame,5%) * 1.4)}
/* Usure du carton : coins éclaircis, grain léger */
.cf-wear{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 0 0,rgba(255,255,255,.28),transparent 5%),radial-gradient(circle at 100% 0,rgba(255,255,255,.22),transparent 5%),
             radial-gradient(circle at 0 100%,rgba(255,255,255,.2),transparent 5%),radial-gradient(circle at 100% 100%,rgba(255,255,255,.25),transparent 5%),
             repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,rgba(0,0,0,.018) 2px 4px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 0 calc(var(--w)*.03) rgba(0,0,0,.35)}
.cbox:not(.opened):hover .sheen{transform:translateX(0)}

/* Dos de la boîte : illustration, captures, texte simulé */
.cbk-art{position:absolute;left:6%;right:6%;top:6%;height:30%;overflow:hidden;border-radius:2px}
.cbk-art img,.cbk-shots img{width:100%;height:100%;object-fit:cover;display:block}
.cbk-shots{position:absolute;left:6%;right:6%;top:40%;height:22%;display:flex;gap:4%}
.cbk-shots img{flex:1;min-width:0;border:2px solid rgba(255,255,255,.7)}
.cbk-shots img+img{object-position:80% 70%}
.cbk-lines{position:absolute;left:6%;right:6%;top:67%;display:flex;flex-direction:column;gap:calc(var(--w)*.025)}
.cbk-lines i{display:block;height:calc(var(--w)*.016);border-radius:2px;background:rgba(255,255,255,.35)}
.cbk-lines i:nth-child(2){width:86%}.cbk-lines i:nth-child(4){width:70%}.cbk-lines i:nth-child(5){width:46%}

/* Fourreau : carton intérieur, logement de la cartouche, encoche pour le doigt */
.cfour{position:absolute;left:calc((var(--w) - var(--Fw)) / 2);top:calc((var(--h) - var(--Fh)) / 2);width:var(--Fw);height:var(--Fh);border-radius:2px;
  transform:translate3d(var(--fx,0px),var(--fy,0px),calc(var(--T) * .45));transition:transform .75s cubic-bezier(.5,.05,.25,1);
  background:linear-gradient(180deg,#ece8de,#d7d1c3);box-shadow:inset 0 0 0 1px rgba(80,70,50,.25),inset 0 0 calc(var(--w)*.05) rgba(90,80,60,.25),0 2px 6px rgba(0,0,0,.3)}
.cfour::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--Cw) * 1.08);height:calc(var(--Ch) * 1.08);transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#b8b09d,#cbc4b2);border-radius:3px;box-shadow:inset 0 3px 7px rgba(60,50,30,.45),0 1px 0 rgba(255,255,255,.6)}
.cf-notch{position:absolute;left:50%;top:0;width:calc(var(--Fw) * .26);height:calc(var(--Fw) * .09);transform:translateX(-50%);border-radius:0 0 999px 999px;
  background:#a89880;box-shadow:inset 0 -2px 4px rgba(0,0,0,.3)}
.unit[data-open="right"] .cf-notch{left:auto;right:0;top:50%;width:calc(var(--Fh) * .09);height:calc(var(--Fh) * .26);transform:translateY(-50%);border-radius:999px 0 0 999px}
.cf-name{position:absolute;left:0;right:0;bottom:4%;text-align:center;font:600 calc(var(--w)*.04)/1 Sora,system-ui,sans-serif;color:rgba(70,62,45,.55)}

/* Notice : couverture = façade réduite, quelques pages sur la tranche */
.cman{position:absolute;left:calc((var(--w) - var(--Mw)) / 2);top:calc((var(--h) - var(--Mh)) / 2);width:var(--Mw);height:var(--Mh);
  transform:translate3d(var(--mx,0px),var(--my,0px),calc(var(--T) * .8));transition:transform .75s cubic-bezier(.5,.05,.25,1)}
.cm-pages{position:absolute;inset:0;border-radius:2px;background:#f4f3ef;
  box-shadow:2px 2px 0 #e6e4de,3px 3px 0 #d9d6cf,4px 4px 0 #ecebe6,5px 5px 6px rgba(0,0,0,.3)}
.cm-cover{position:absolute;inset:0;border-radius:2px;overflow:hidden;background:var(--box);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cm-band{position:absolute;left:0;right:0;top:0;height:13%;background:var(--band-bg);display:flex;align-items:center;padding:0 7%}
.cm-band b{font:800 calc(var(--Mw)*.06)/1 Sora,system-ui,sans-serif;color:var(--band-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-band img{height:55%;width:auto;max-width:70%;filter:var(--band-logo)}
.cm-cover>img{position:absolute;left:6%;right:6%;top:17%;bottom:16%;width:88%;height:67%;object-fit:cover}
.cm-cover>span{position:absolute;left:6%;right:6%;bottom:5%;font:600 calc(var(--Mw)*.055)/1.1 Sora,system-ui,sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Cartouche dans le carton */
.ccart-w{position:absolute;left:calc((var(--w) - var(--Cw)) / 2);top:calc((var(--h) - var(--Ch)) / 2);width:var(--Cw);height:var(--Ch);
  transform:translate3d(var(--cx,0px),var(--cy,0px),calc(var(--T) * .45 + 2px));transition:transform .75s cubic-bezier(.5,.05,.25,1)}

/* ---------- Séquence d'ouverture ---------- */
/* s1 : la boîte bascule pour montrer le rabat, qui s'ouvre */
.unit[data-open="top"].s1 .cbox{--oy:calc(var(--Fh) + var(--gap));--rx:-26deg}
.unit[data-open="top"].s1 .cb-top{transform:rotateX(195deg)}
.unit[data-open="right"].s1 .cbox{--ry:-30deg}
.unit[data-open="right"].s1 .cb-right{transform:rotateY(170deg)}
/* s2 : le fourreau (avec cartouche et notice) sort par l'ouverture */
.unit[data-open="top"].s2 :is(.cfour,.cman){--fy:calc(-1 * (var(--Fh) + var(--gap)));--my:calc(-1 * (var(--Fh) + var(--gap)))}
.unit[data-open="top"].s2 .ccart-w{--cy:calc(-1 * (var(--Fh) + var(--gap)))}
.unit[data-open="right"].s2 :is(.cfour,.cman){--fx:calc(var(--w) + var(--gap));--mx:calc(var(--w) + var(--gap))}
.unit[data-open="right"].s2 .ccart-w{--cx:calc(var(--w) + var(--gap))}
/* s3 : la boîte se redresse, la notice glisse sur le côté, la cartouche sort du fourreau */
.unit[data-open="top"].s3 .cbox{--rx:0deg}
.unit[data-open="top"].s3 .cman{--mx:calc(var(--w) + var(--gap))}
.unit[data-open="top"].s3 .ccart-w{--cx:calc(var(--w) * .5);--cy:calc(-1 * (var(--Fh) + var(--gap)) - var(--Ch) * .45)}
.unit[data-open="right"].s3 .cbox{--ry:0deg}
.unit[data-open="right"].s3 .cman{--my:calc(var(--h) + var(--gap))}
.unit[data-open="right"].s3 .ccart-w{--cx:calc(var(--w) * 1.25 + var(--gap) + var(--Cw) * .3);--cy:calc(var(--h) * .55)}
/* s4 : la cartouche se pose à côté de la boîte */
.unit[data-open="top"].s4 .ccart-w{--cx:calc(var(--w) + var(--gap));--cy:0px}
.unit[data-open="right"].s4 .ccart-w{--cx:0px;--cy:calc(var(--h) + var(--gap))}
.unit[data-family="carton"] .ccart-w .cart{transition:box-shadow .5s}
.unit[data-family="carton"].s3 .ccart-w .cart{box-shadow:0 calc(var(--w)*.05) calc(var(--w)*.1) rgba(0,0,20,.45),inset 0 0 0 1px rgba(255,255,255,.18)}

.unit[data-family="carton"] .close{top:0;right:0;z-index:6}
.unit[data-family="carton"].s3 .close{opacity:1;pointer-events:auto;transition-delay:.2s}
.unit[data-family="carton"].s1 .cbox{cursor:pointer}

@media (prefers-reduced-motion:reduce){
  .cstage,.cbox,.cb-top,.cb-right,.cfour,.cman,.ccart-w,.cart-wrap .cart{transition-duration:.2s}
}

/* ===================== PS Vita : fidèle aux photos fournies ===================== */
/* Façade : bandeau bleu, liseré blanc dessous, logo à gauche */
.unit[data-platform="VITA"] .sleeve{--bh:calc(var(--h) * .08)}

/* Intérieur : ni encoches d'ouverture, ni cadre intérieur, un seul crochet */
.unit[data-platform="VITA"] :is(.notch,.rim){display:none}
.unit[data-platform="VITA"] :is(.inside,.clip-layer) .tab.l2{display:none}
.unit[data-platform="VITA"] :is(.inside,.clip-layer) .tab.l1{left:5.7%;top:42.6%;width:25%;height:14%;opacity:1;border-radius:calc(var(--w)*.022);

.unit[data-platform="VITA"] .hinge{background:linear-gradient(90deg,rgba(0,0,20,.55) 0 7%,var(--p-lo) 7% 15%,var(--p) 26%,var(--p-hi) 50%,var(--p) 74%,var(--p-lo) 85% 93%,rgba(0,0,20,.55) 93%)}

  linear-gradient(var(--shade-strong),var(--shade-strong)) calc(var(--w)*.016) 13.5%/calc(var(--w)*.012) calc(var(--w)*.032) no-repeat,
  linear-gradient(var(--shade-strong),var(--shade-strong)) calc(var(--w)*.016) 86.5%/calc(var(--w)*.012) calc(var(--w)*.032) no-repeat,
  linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) calc(var(--w)*.045) 50%/1px 80% no-repeat}
/* Volet droit : petites marques sur les rebords haut et bas, marche du rebord droit */
.unit[data-platform="VITA"] .back .bars{display:block;position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(var(--shade-strong),var(--shade-strong)) 27% calc(var(--w)*.006)/calc(var(--w)*.01) calc(var(--w)*.02) no-repeat,
  linear-gradient(var(--shade-strong),var(--shade-strong)) 70% calc(var(--w)*.006)/calc(var(--w)*.01) calc(var(--w)*.02) no-repeat,
  linear-gradient(var(--shade-strong),var(--shade-strong)) 27% calc(100% - var(--w)*.006)/calc(var(--w)*.01) calc(var(--w)*.02) no-repeat,
  linear-gradient(var(--shade-strong),var(--shade-strong)) 70% calc(100% - var(--w)*.006)/calc(var(--w)*.01) calc(var(--w)*.02) no-repeat,
  linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) calc(100% - var(--w)*.045) 50%/1px 80% no-repeat}
/* Support de carte : bloc rectangulaire, languette de maintien en haut, logement de la carte en bas */

/* Disque : calotte noire au bord inférieur courbe, filet clair, « XBOX » centré */
.xcap{display:none}
.unit[data-platform="XBOX"] .disc{background:linear-gradient(180deg,#1b1b1c,#0e0e0f 30%)}
.unit[data-platform="XBOX"] .disc .band{display:none}
.unit[data-platform="XBOX"] .disc .disc-art{clip-path:circle(144.3% at 50% 164.3%)}
.unit[data-platform="XBOX"] .xcap{display:block;position:absolute;inset:0;pointer-events:none}
.unit[data-platform="XBOX"] .xcap::before{content:"";position:absolute;left:calc(50% - 144.3%);top:20%;width:288.6%;height:288.6%;border-radius:50%;
  box-shadow:0 0 0 1.5px rgba(225,226,215,.75)}
.unit[data-platform="XBOX"] .xcap img{position:absolute;left:50%;top:10.4%;width:34%;height:auto;transform:translate(-50%,-50%)}

/* ===================== Xbox : logo du bandeau un peu plus clair, signalétique d'âge en deux morceaux ===================== */
.unit[data-platform="XBOX"] .sleeve .top img{filter:brightness(1.2) saturate(1.05)}
.unit:is([data-platform="XBOX"],[data-platform="X360"]) .age{left:calc(var(--w)*.03);bottom:calc(var(--w)*.06);width:calc(var(--w)*.1);height:calc(var(--w)*.1);box-sizing:border-box;border-radius:1px;
  border:calc(var(--w)*.005) solid #fff;color:#fff;box-shadow:none;font-size:calc(var(--w)*.058);overflow:visible;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 1px,transparent 1px 3px),rgba(255,255,255,.08)}
.unit:is([data-platform="XBOX"],[data-platform="X360"]) .age::after{content:"+";font-size:.62em;align-self:flex-start;margin-top:.3em}
.unit:is([data-platform="XBOX"],[data-platform="X360"]) .age::before{content:"www.pegi.info";position:absolute;left:calc(var(--w)*-.005);right:calc(var(--w)*-.005);top:calc(100% + var(--w)*.007);
  height:calc(var(--w)*.026);background:#fff;color:#111;font:600 calc(var(--w)*.016)/calc(var(--w)*.026) Arial,Helvetica,sans-serif;text-align:center;white-space:nowrap;letter-spacing:0}

/* ===================== Livret PS1 : même taille de logo dans la boîte et une fois sorti ===================== */
.unit[data-platform="PS1"] .manual .ps1-cover{font-size:calc(var(--w)*.00966)}

/* ===================== Livret rangé : visible dans la boîte dès l'ouverture (il pivote avec le couvercle) ===================== */
.inside-manual{display:none}
.unit:not([data-platform="PS1"]) .inside-manual{display:block;position:absolute;left:50%;top:50%;width:var(--mw);height:var(--mh);transform:translate(-50%,-50%);
  z-index:2;overflow:hidden;border-radius:2px;cursor:pointer;box-shadow:0 calc(var(--w)*.015) calc(var(--w)*.03) rgba(0,0,30,.3)}
.unit:not([data-platform="PS1"]):is(.manual-out,.manual-back) .inside-manual{visibility:hidden}
.unit:not([data-platform="PS1"]):not(.manual-out):not(.manual-back) .ps1-top .manual{visibility:hidden}

/* ===================== Xbox 360 : vert anis translucide, bandeau clair + filet vert, logo à gauche ===================== */
.unit[data-platform="X360"] .plastic{
  background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.08) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18)),
             linear-gradient(180deg,rgba(172,232,64,.72),rgba(150,220,40,.66) 45%,rgba(118,190,26,.74));
  box-shadow:inset 0 0 0 1.5px rgba(225,255,170,.7),inset 0 0 calc(var(--w)*.03) rgba(80,140,10,.35)}
.unit[data-platform="X360"] .sleeve{--bh:calc(var(--h) * .107)}
.unit[data-platform="X360"] .sleeve .top{background:linear-gradient(180deg,#f1f2ee,#e1e3dd);padding-left:calc(var(--w)*.045);justify-content:flex-start;overflow:visible}
.unit[data-platform="X360"] .sleeve .top img{width:calc(var(--w)*.46);height:auto;max-height:76%;max-width:none;object-fit:contain;object-position:left center;filter:none;}
/* Filet vert sous le bandeau, du vert clair au vert foncé */
.unit[data-platform="X360"] .sleeve .top::after{content:"";position:absolute;left:0;right:0;top:100%;height:calc(var(--h) * .012);
  background:linear-gradient(90deg,#9fd141,#62a823 45%,#2f6e14)}
/* Tranche : fond clair, sphère en haut, « XBOX 360 » à la verticale, titre en gris foncé */
.unit[data-family][data-platform="X360"]:not([data-family="carton"]) .e-spine{background:linear-gradient(90deg,#d9dbd5,#f1f2ee 40%,#e3e5df)}
.unit[data-family][data-platform="X360"]:not([data-family="carton"]) .e-band{position:relative;background:transparent;height:calc(var(--T) * 4.1)}
.unit[data-platform="X360"] .e-ico{display:none}

.unit[data-family][data-platform="X360"]:not([data-family="carton"]) .e-title{color:#2b2b2b}

/* ===================== Encoches du volet gauche : plus de doublon pendant l'ouverture ===================== */
.clip-layer{visibility:hidden}
.unit.manual-back .clip-layer{visibility:visible}

/* ===================== Disque Xbox 360 : calotte claire en haut, logo, filet vert ===================== */
.gcap{display:none}
.unit[data-platform="X360"] .disc .band{display:none}
.unit[data-platform="X360"] .disc-wrap .gcap{display:block;position:absolute;left:0;right:0;top:0;height:19.6%;pointer-events:none;background:linear-gradient(180deg,#f3f4f1,#e2e4df)}
.unit[data-platform="X360"] .disc-wrap .gcap::after{content:"";position:absolute;left:0;right:0;top:100%;height:7%;background:linear-gradient(90deg,#a6d64a,#62a823 45%,#2f6e14)}
.unit[data-platform="X360"] .disc-wrap .gcap img{position:absolute;left:37.9%;top:69%;width:36%;height:auto;transform:translate(-50%,-50%)}
.unit[data-platform="X360"] .disc-wrap .gcap b{display:none}

/* ===================== Xbox One / Series : boîtier vert transparent, disque à gauche, livret à droite ===================== */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .plastic{
  background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.06) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.16)),
             linear-gradient(180deg,rgba(84,190,70,.66),rgba(62,168,52,.6) 45%,rgba(40,138,36,.7));
  box-shadow:inset 0 0 0 1.5px rgba(200,255,190,.6),inset 0 0 calc(var(--w)*.03) rgba(20,90,20,.35)}
/* Bandeau de façade : vert (One) ou noir (Series), logo blanc centré, fin filet sombre dessous */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .sleeve{--bh:calc(var(--h) * .08)}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .sleeve .top{justify-content:center;padding:0;box-shadow:0 calc(var(--w)*.005) 0 rgba(0,40,0,.55)}
.unit[data-platform="XONE"] .sleeve .top{background:linear-gradient(180deg,#5cb43a,#45a02c)}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .sleeve .top img{width:calc(var(--w)*.33);height:auto;max-height:62%;max-width:none;object-fit:contain;filter:none}
.unit[data-platform="XSX"] .sleeve .top img{width:calc(var(--w)*.23)}
/* Le disque passe sur le volet gauche */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .back :is(.well,.disc-wrap){display:none}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .well2{display:block;position:absolute;left:50%;top:52%;width:calc(var(--w)*.9);height:calc(var(--w)*.9);
  transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);
  box-shadow:0 0 0 1.5px rgba(225,255,215,.45),inset 0 0 calc(var(--w)*.02) rgba(0,60,0,.3)}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .disc-wrap2{display:block;position:absolute;left:50%;top:52%;width:calc(var(--w)*.8);height:calc(var(--w)*.8);
  transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:2}
/* Disque One / Series : calotte verte avec logo blanc, bande sombre avec la mention des consoles */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .disc-wrap2 .gcap{display:block;position:absolute;left:0;right:0;top:0;height:12%;pointer-events:none;background:linear-gradient(180deg,#6cbd45,#4f9e2f)}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .disc-wrap2 .gcap::after{content:"";position:absolute;left:0;right:0;top:100%;height:100%;background:#232325}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .disc-wrap2 .gcap img{position:absolute;left:50%;top:50%;width:20%;height:auto;transform:translate(-50%,-50%)}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .disc-wrap2 .gcap b{position:absolute;z-index:1;left:0;right:0;top:150%;transform:translateY(-50%);text-align:center;
  color:#fff;font:700 calc(var(--w)*.024)/1 Arial,Helvetica,sans-serif;letter-spacing:.02em;white-space:nowrap}
/* Volet gauche : barres de maintien en haut et en bas avec leurs montants, logo moulé vu à l'envers */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .inside .bars{display:block;position:absolute;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(rgba(225,255,215,.5),rgba(225,255,215,.5)) 50% 13%/72% 1.5px no-repeat,
  linear-gradient(rgba(225,255,215,.5),rgba(225,255,215,.5)) 50% 87%/72% 1.5px no-repeat,
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 14% 17%/1.5px 9% no-repeat,
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 86% 17%/1.5px 9% no-repeat,
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 14% 83%/1.5px 9% no-repeat,
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 86% 83%/1.5px 9% no-repeat,
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 50% 14.5%/1.5px 2.5% no-repeat,
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 50% 85.5%/1.5px 2.5% no-repeat}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .inside .bars::before{content:"";position:absolute;left:50%;top:4.5%;width:calc(var(--w)*.4);height:calc(var(--w)*.08);
  transform:translateX(-50%) scaleX(-1);background:var(--xone-mold) center/contain no-repeat;opacity:.35}
/* Volet droit : grand logo sphérique moulé au centre, barres haut et bas, deux crochets du livret à droite */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .back .bars{display:block;position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 50% 9%/70% 1.5px no-repeat,
  linear-gradient(rgba(225,255,215,.45),rgba(225,255,215,.45)) 50% 91%/70% 1.5px no-repeat}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .back .bars::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--w)*.62);aspect-ratio:1;
  transform:translate(-50%,-50%);background:var(--xone-sphere) center/contain no-repeat;opacity:.22;filter:drop-shadow(0 1px 1px rgba(0,60,0,.5))}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .back .tab{right:2.5%;width:calc(var(--w)*.09);height:calc(var(--w)*.12);z-index:3;border-radius:calc(var(--w)*.012);
  background:linear-gradient(90deg,rgba(150,230,140,.75),rgba(110,200,100,.7));box-shadow:inset 0 0 0 1.5px rgba(230,255,220,.6),0 2px 4px rgba(0,60,0,.35)}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .back .tab.r1{top:12%}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .back .tab.r2{top:auto;bottom:12%}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) :is(.inside,.clip-layer) .tab{display:none}
/* Livret rangé sur le volet droit */
.back-manual{display:none}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .inside-manual{display:none}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .back-manual{display:block;position:absolute;left:50%;top:50%;width:var(--mw);height:var(--mh);transform:translate(-50%,-50%);
  z-index:2;overflow:hidden;border-radius:2px;cursor:pointer;box-shadow:0 calc(var(--w)*.015) calc(var(--w)*.03) rgba(0,0,30,.3)}
.unit:is([data-platform="XONE"],[data-platform="XSX"]):is(.manual-out,.manual-back) .back-manual{visibility:hidden}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .clip-layer{display:none}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .manual{left:calc(var(--w)*1.56 + var(--sp) - var(--mw,calc(var(--w)*.8)) / 2)}
.unit.manual-out:is([data-platform="XONE"],[data-platform="XSX"]) .manual{left:calc(var(--w)*.53 - var(--mw,calc(var(--w)*.8)) / 2)}

/* ===================== Xbox One / Series : retenues bombées autour du disque, bandes horizontales ===================== */
.xret{display:none}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .xret{display:block;position:absolute;left:15%;width:70%;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(235,255,225,.38),rgba(120,205,110,.22) 45%,rgba(20,100,20,.28));
  box-shadow:inset 0 0 0 1.5px rgba(225,255,215,.55),inset 0 calc(var(--w)*.01) calc(var(--w)*.02) rgba(255,255,255,.25)}
/* Retenue du haut : du haut du logement jusqu'au cercle du disque, bord inférieur en arc */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .xret-t{top:calc(var(--h) * .115);height:calc(var(--h) * .405 - var(--w) * .3);
  -webkit-mask:radial-gradient(circle calc(var(--w) * .455) at 50% calc(100% + var(--w) * .3),transparent 99%,#000 100%);
          mask:radial-gradient(circle calc(var(--w) * .455) at 50% calc(100% + var(--w) * .3),transparent 99%,#000 100%)}
/* Retenue du bas : symétrique */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .xret-b{top:calc(var(--h) * .52 + var(--w) * .3);height:calc(var(--h) * .365 - var(--w) * .3);
  background:linear-gradient(0deg,rgba(235,255,225,.38),rgba(120,205,110,.22) 45%,rgba(20,100,20,.28));
  -webkit-mask:radial-gradient(circle calc(var(--w) * .455) at 50% calc(var(--w) * -.3),transparent 99%,#000 100%);
          mask:radial-gradient(circle calc(var(--w) * .455) at 50% calc(var(--w) * -.3),transparent 99%,#000 100%)}
/* Bord en arc des retenues (petit liseré clair qui suit le disque) */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .well2{box-shadow:0 0 0 1.5px rgba(225,255,215,.5),0 0 0 calc(var(--w)*.012) rgba(20,100,20,.18),inset 0 0 calc(var(--w)*.02) rgba(0,60,0,.3)}
/* Bandes horizontales en relief, en haut et en bas des deux volets */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) :is(.inside,.back) .bars{background:
  linear-gradient(rgba(235,255,225,.6),rgba(235,255,225,.6)) 50% 8.2%/76% 1px no-repeat,
  linear-gradient(180deg,rgba(60,150,55,.55),rgba(25,100,25,.6)) 50% 8.6%/76% calc(var(--w)*.022) no-repeat,
  linear-gradient(rgba(235,255,225,.6),rgba(235,255,225,.6)) 50% 91.4%/76% 1px no-repeat,
  linear-gradient(180deg,rgba(60,150,55,.55),rgba(25,100,25,.6)) 50% 92%/76% calc(var(--w)*.022) no-repeat}
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .inside .bars::before{top:2.2%}

/* Xbox One / Series : pas de cercle autour du disque, seules les retenues du haut et du bas suivent sa forme */
.unit:is([data-platform="XONE"],[data-platform="XSX"]) .well2{background:none;box-shadow:none}

/* Disque Xbox One : calotte verte seule (pas de bande noire), logo « XBOX ONE » centré */
.unit[data-platform="XONE"] .disc-wrap2 .gcap{height:18%;background:linear-gradient(180deg,#3fae55,#2f9e47)}
.unit[data-platform="XONE"] .disc-wrap2 .gcap::after,.unit[data-platform="XONE"] .disc-wrap2 .gcap b{display:none}
.unit[data-platform="XONE"] .disc-wrap2 .gcap img{top:57%;width:39%}

/* ---------- Press Start : affichage dans la fiche ---------- */
html,body{background:transparent !important}
body::before,body::after{display:none !important}
main{padding:14px 10px 18px !important;gap:12px !important;min-height:100vh;justify-content:center;box-sizing:border-box}
main>h1,main>.hint,.actions{display:none !important}
.unit{--w:min(290px, calc((100vw - 40px) / 2.14)) !important}
.ph-front .sleeve .top,.ph-front .age,.ph-front .pal,.ph-front .ps2-plat,.ph-front .plat-strip,.ph-front .ps1-cover{display:none !important}
.ph-front .cover .front-art{top:0 !important;height:100% !important;object-fit:cover}
.ph-spine .e-spine{background:var(--ph-spine) center/100% 100% no-repeat !important}
.ph-spine .e-spine>*{display:none !important}
.no-age .age{display:none !important}
.ps-flip{font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:#fff;color:#1E2A44;cursor:pointer;box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.stage{transform-style:preserve-3d}
</style>

/* ---------- Jaquettes de démonstration ---------- */
function demoArt(t){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.sky[0]}"/><stop offset="1" stop-color="${t.sky[1]}"/></linearGradient>
  <radialGradient id="g" cx=".5" cy=".42" r=".45"><stop offset="0" stop-color="${t.glow}" stop-opacity=".85"/><stop offset="1" stop-color="${t.glow}" stop-opacity="0"/></radialGradient></defs>
  <rect width="400" height="500" fill="url(#s)"/><rect width="400" height="500" fill="url(#g)"/>
  <path d="M0 360 L70 280 L120 320 L190 230 L250 300 L310 250 L400 330 L400 500 L0 500Z" fill="${t.hills[0]}"/>
  <path d="M0 420 L90 350 L160 400 L240 340 L330 395 L400 360 L400 500 L0 500Z" fill="${t.hills[1]}"/>
  <text x="200" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="40" letter-spacing="6" fill="#fff">${t.l1}</text>
  <text x="200" y="185" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="7" fill="#fff" opacity=".85">${t.l2}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

/* Jaquette avant d'un jeu PS1 (boîtier cristal) : image, bloc logo, PAL, bande du bas */
function ps1Cover(g){
  const plat=isPlatinum(g);
  const wm=plat ? '<div class="c-wm-wrap"><img class="c-wm" alt="PlayStation"><span class="c-plat-bar"><b>PLATINUM</b></span></div>'
                : '<img class="c-wm" alt="PlayStation">';
  return '<img class="c-art" alt=""><div class="c-logo"><img alt=""><span>PlayStation</span></div>'
       + '<div class="c-pal"><span>PAL</span></div>'
       + '<div class="c-band'+(plat?' c-plat':'')+'"><span class="c-holo"></span>'+wm+'</div>';
}

/* Édition Platinum : uniquement pour les jeux PS3 dont le champ edition vaut "Platinum" */
const isPlatinum = g => ["PS1","PS2","PS3","PSP"].includes(g.plateforme) && String(g.edition||"").toLowerCase()==="platinum";

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const units = [];

function el(tag, attrs={}){ const e=document.createElement(tag); Object.assign(e, attrs); return e; }

/* ---------- Composant : une boîte pour un jeu ---------- */
function createGameCase(game){
  const root = document.getElementById("case-tpl").content.firstElementChild.cloneNode(true);
  const q = s => root.querySelector(s);
  const caseEl=q(".case"), discWrap=q(".disc-wrap"), disc=q(".disc"), closeBtn=q(".close"), now=q(".now");
  let current = game;

  function renderBrand(){
    const p=current.plateforme, logo=LOGOS[p], front=q(".brand-front"), d=q(".brand-disc");
    front.replaceChildren(); d.replaceChildren();
    front.setAttribute("aria-label",p); d.setAttribute("aria-label",p);
    if(logo && logo.icon && logo.mark) front.append(el("img",{src:logo.icon,alt:"",className:"ico"}), el("img",{src:logo.mark,alt:"",className:"wm"}));
    else if(logo && logo.full) front.append(el("img",{src:logo.full,alt:""}));
    else front.append(el("b",{textContent:pname(p)}));
    if(logo && logo.full) d.append(el("img",{src:logo.full,alt:""}));
    else d.append(el("b",{textContent:pname(p)}));
    if(p==="PS2"){
      front.replaceChildren(
        logo && logo.full ? el("img",{src:logo.full,alt:"",className:"ps2-wm"}) : el("span",{className:"ps2-word",innerHTML:"PlayStation<small>®</small>2"}),
        el("img",{src:PLAT_ICON,alt:"",className:"ps2-ico"}));
      front.setAttribute("aria-label","PlayStation 2");
      if(!(logo && logo.full)) d.replaceChildren(el("b",{textContent:"PlayStation 2"}));
      q(".mc img").src=LOGOS.PS5.icon;
      if(LOGOS.PS2 && LOGOS.PS2.full) q(".ps2-plat-wm").src=LOGOS.PS2.full;
    }
    if(p==="PSP"){
      front.replaceChildren(
        logo && logo.full ? el("img",{src:logo.full,alt:"",className:"psp-wm"}) : el("span",{className:"psp-word",textContent:"PSP"}),
        el("img",{src:PLAT_ICON,alt:"",className:"ps2-ico"}));
      front.setAttribute("aria-label","PSP");
      q(".ps2-plat span").innerHTML="The Best of PSP<small>™</small><br><em>(PlayStation®Portable)</em>";
    } else if(p==="PS2"){
      q(".ps2-plat span").innerHTML='The Best of<img class="ps2-plat-wm" alt="">';
      if(LOGOS.PS2 && LOGOS.PS2.full) q(".ps2-plat-wm").src=LOGOS.PS2.full;
    }
    if(p==="PS3" && isPlatinum(current)){
      front.replaceChildren(el("div",{className:"plat",innerHTML:"<b>PLATINUM</b><span>LES MEILLEURS JEUX AU MEILLEUR PRIX</span>"}));
      front.setAttribute("aria-label","PS3 Platinum");
      q(".plat-ico img").src=PLAT_ICON;
    }
  }

  function render(g){
    current=g;
    root.dataset.platform=g.plateforme;
    applyPlatform(root,g.plateforme);
    root.dataset.edition=isPlatinum(g)?"platinum":"";
    root.dataset.case=g.boitier||"";
    root.dataset.format=g.plateforme==="PS1" && g.format==="double" ? "double" : "";
    const info=q(".info");
    if(g.plateforme==="PS1"){
      root.querySelectorAll(".ps1-cover").forEach(c=>{ c.innerHTML=ps1Cover(g); c.querySelector(".c-art").src=g.jaquetteUrl||""; c.querySelector(".c-logo img").src=PLAT_ICON; c.querySelector(".c-wm").src=LOGOS.PS1.wm; });
      root.querySelectorAll(".disc-ps1 img").forEach(i=>i.src=PLAT_ICON);
      q(".disc-art2").src=g.jaquetteUrl||"";
    }
    if(["X360","XONE","XSX"].includes(g.plateforme)){
      const xone=g.plateforme!=="X360", cap=q(xone?".disc-wrap2 .gcap":".disc-wrap .gcap");
      cap.querySelector("img").src = g.plateforme==="XONE" ? XONE_LOGO : xone ? XBOX_DISC_LOGO : LOGOS.X360.full;
      cap.querySelector("b").textContent = g.plateforme==="XSX" ? "XBOX SERIES X · XBOX ONE" : "XBOX ONE";
      if(xone){ q(".disc-art2").src=g.jaquetteUrl||""; root.style.setProperty("--xone-sphere",'url("'+XONE_SPHERE+'")'); root.style.setProperty("--xone-mold",'url("'+XONE_LOGO+'")'); }
    }
    if(info.parentNode!==q(".ps1-info")) q(".ps1-info").append(info);
    const imgs=[q(".front-art"),q(".inner-art"),q(".disc-art")];
    imgs.forEach(i=>i.style.opacity=0);
    setTimeout(()=>{ imgs.forEach(i=>{ i.src=g.jaquetteUrl||""; i.style.opacity=1; }); setTimeout(updateManual,60); },180);
    q(".front-art").alt="Jaquette de "+g.titre;
    const age=q(".age"); age.textContent=g.age??""; age.style.display=g.age?"flex":"none";
    q(".gname").textContent=g.titre;
    q(".e-title").textContent=g.titre;
    if(g.plateforme==="PSP" && LOGOS.PSP){ q(".umd-psp").src=LOGOS.PSP.full; root.style.setProperty("--psp-wm",'url("'+LOGOS.PSP.full+'")'); }
    { /* Dos : PS3/PS4/PS5 = logo de la console à la verticale + jaquette en fond ; PS1/PS2 = icône */
      const ico=q(".e-ico"), lg=LOGOS[g.plateforme], modern=["PS3","PS4","PS5"].includes(g.plateforme);
      if(PLAT[g.plateforme]){ if(lg && lg.full){ ico.src=lg.full; ico.classList.add("rot"); } else { ico.removeAttribute("src"); ico.classList.remove("rot"); } }
      else { ico.src = modern && lg && lg.full ? lg.full : PLAT_ICON; ico.classList.toggle("rot", !!(modern && lg && lg.full)); }
      q(".e-spine").style.setProperty("--spine-art", g.jaquetteUrl ? 'url("'+g.jaquetteUrl+'")' : "none");
    }
    q(".disc-title").textContent=g.titre.toUpperCase(); q(".gsub").textContent=[pname(g.plateforme),g.sousTitre].filter(Boolean).join(" · ");
    const tags=q(".tags"); tags.replaceChildren();
    (g.tags||[]).forEach(t=>{ const s=el("span",{className:"tag",textContent:t.label}); if(t.couleur) s.style.setProperty("--c",t.couleur); tags.append(s); });
    q(".now-title").textContent=g.titre+" · "+pname(g.plateforme);
    q(".act-logo-label").firstChild.textContent="Logo "+pname(g.plateforme);
    if(PLAT[g.plateforme]){ q(".cart-wrap .lbl>img").src=g.jaquetteUrl||""; q(".cart-wrap .lband img").src=(LOGOS[g.plateforme]&&(LOGOS[g.plateforme].card||LOGOS[g.plateforme].full))||""; q(".cart-wrap .lcode").replaceChildren(el("span",{textContent:g.code||""})); q(".cart-wrap .lbl b").textContent=g.titre; if(PLAT[g.plateforme].family==="cart") q(".now-state").textContent=q(".cart-wrap").classList.contains("lifted")?"Cartouche sortie":"Cartouche en place"; }
    caseEl.setAttribute("aria-label",(caseEl.classList.contains("open")?"Boîte ouverte : ":"Ouvrir la boîte de ")+g.titre);
    renderBrand();
    updateManual();
  }

  /* Livret sorti de la boîte : copie réduite de la jaquette avant (PS1 : jaquette dédiée) */
  function updateManual(){
    const front=q(".manual-front");
    if(current.plateforme==="PS1"){ front.replaceChildren(); q(".inside-manual").replaceChildren(); root.style.removeProperty("--top-area"); return; }
    const sl=q(".front .sleeve"), W=caseEl.offsetWidth, ow=sl.offsetWidth, oh=sl.offsetHeight;
    if(!ow||!oh) return;
    const k=(["PS2","XBOX","X360","GC","WII","WIIU"].includes(current.plateforme) ? Math.min(caseEl.offsetHeight*.9/oh, W*.9/ow) : current.plateforme==="PS3" ? caseEl.offsetHeight*.806/oh : (current.plateforme==="PSP" || (PLAT[current.plateforme] && caseEl.offsetWidth/caseEl.offsetHeight<.7)) ? caseEl.offsetHeight*.92/oh : W*.82/ow), clone=sl.cloneNode(true);
    clone.style.cssText=`position:absolute;inset:auto;left:0;top:0;width:${ow}px;height:${oh}px;transform:scale(${k});transform-origin:0 0`;
    front.replaceChildren(clone); q(".inside-manual").replaceChildren(clone.cloneNode(true)); q(".back-manual").replaceChildren(clone.cloneNode(true));
    root.style.setProperty("--mw",(ow*k)+"px"); root.style.setProperty("--mh",(oh*k)+"px");
    root.style.setProperty("--top-area",(oh*k + W*.32)+"px");
  }

  function setOpen(open){
    caseEl.classList.toggle("open",open); root.classList.toggle("is-open",open); if(!open) q(".cart-wrap").classList.remove("lifted"); q(".cart-wrap").tabIndex=open?0:-1;
    if(!open){ root.classList.remove("manual-out"); root.classList.add("closing-anim"); clearTimeout(root._ct); root._ct=setTimeout(()=>root.classList.remove("closing-anim"),1150); }
    else { clearTimeout(root._ct); root.classList.remove("closing-anim"); }
    caseEl.classList.remove("tilting"); caseEl.style.removeProperty("--tilt-x"); caseEl.style.removeProperty("--tilt-y");
    caseEl.setAttribute("aria-expanded",open);
    discWrap.tabIndex=open?0:-1; closeBtn.tabIndex=open?0:-1;
    render(current);
  }
  /* Fermeture : si le livret est sorti, il revient d'abord à sa place (pages repliées), puis la boîte se referme */
  let closing=false;
  function requestClose(){
    if(closing || !caseEl.classList.contains("open")) return;
    if(!root.classList.contains("manual-out")){ setOpen(false); return; }
    closing=true;
    root.classList.add("manual-back"); root.classList.remove("manual-out");
    setTimeout(()=>{ root.classList.remove("manual-back"); closing=false; setOpen(false); }, reduce?150:650);
  }

  /* Un clic sur la boîte l'ouvre ; une fois ouverte, un clic n'importe où la referme (sauf sur un disque) */
  q(".stage").addEventListener("click",e=>{
    if(e.target.closest(".disc-wrap,.disc-wrap2,.cart-wrap,.close")) return;
    e.fromUnit=root;   /* mémorisé avant le rendu, qui peut remplacer l'élément cliqué */
    if(closing) return;
    if(e.target.closest(".manual,.tray-manual,.inside-manual,.back-manual") && caseEl.classList.contains("open")){
      if(root.classList.contains("manual-out")){ root.classList.add("manual-back"); root.classList.remove("manual-out"); setTimeout(()=>root.classList.remove("manual-back"),650); }
      else root.classList.add("manual-out");
      return;
    }
    if(!caseEl.classList.contains("open")) setOpen(true);
    else requestClose();
  });
  caseEl.addEventListener("keydown",e=>{ if(e.target===caseEl && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); if(caseEl.classList.contains("open")) requestClose(); else setOpen(true); } });
  closeBtn.addEventListener("click",e=>{ e.stopPropagation(); requestClose(); caseEl.focus(); });

  caseEl.addEventListener("pointermove",e=>{
    if(reduce||caseEl.classList.contains("open")||e.pointerType!=="mouse") return;
    const r=caseEl.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    caseEl.classList.add("tilting");
    caseEl.style.setProperty("--tilt-y",(x*40)+"deg"); caseEl.style.setProperty("--tilt-x",(-y*16)+"deg");
  });
  caseEl.addEventListener("pointerleave",()=>{ caseEl.classList.remove("tilting"); caseEl.style.removeProperty("--tilt-x"); caseEl.style.removeProperty("--tilt-y"); });

  /* Disques : élan ~1,2 s puis décélération naturelle ; chaque disque tourne indépendamment */
  const TOP=reduce?120:560; let spinning=0;
  function setNow(){ now.classList.toggle("spinning",spinning>0); q(".now-state").textContent=spinning>0?"Disque en cours":"Disque en place"; }
  function makeSpinner(discEl){
    let angle=0, vel=0, hold=0, raf=null, last=0;
    function tick(t){
      const dt=Math.min(.05,(t-last)/1000); last=t;
      if(hold>0){ hold-=dt; vel+=(TOP-vel)*(1-Math.exp(-7*dt)); } else vel*=Math.exp(-2.2*dt);
      angle=(angle+vel*dt)%360; discEl.style.transform=`rotate(${angle}deg)`;
      if(hold<=0 && vel<2){ vel=0; raf=null; spinning--; setNow(); return; }
      raf=requestAnimationFrame(tick);
    }
    return ()=>{ hold=1.2; if(!raf){ spinning++; setNow(); last=performance.now(); raf=requestAnimationFrame(tick); } };
  }
  const spin=makeSpinner(disc), spin2=makeSpinner(q(".disc-wrap2 .disc"));
  discWrap.addEventListener("click",e=>{ e.stopPropagation(); if(caseEl.classList.contains("open")) spin(); });
  q(".disc-wrap2").addEventListener("click",e=>{ e.stopPropagation(); if(caseEl.classList.contains("open")) spin2(); });
  discWrap.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopPropagation(); spin(); } });
  const cartWrap=q(".cart-wrap");
  function toggleCart(){ if(!caseEl.classList.contains("open")) return; const on=cartWrap.classList.toggle("lifted"); q(".now-state").textContent=on?"Cartouche sortie":"Cartouche en place"; }
  cartWrap.addEventListener("click",e=>{ e.stopPropagation(); toggleCart(); });
  cartWrap.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopPropagation(); toggleCart(); } });

  /* Actions de démonstration */
  q(".act-next").addEventListener("click",()=>{
    const list=(DEMO[current.plateforme]||[]).filter(g=>isPlatinum(g)===isPlatinum(current) && (g.boitier||"")===(current.boitier||"") && (g.format||"")===(current.format||"")); const i=list.findIndex(g=>g.titre===current.titre);
    if(list.length) render(list[(i+1)%list.length]);
  });
  q(".act-art").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>render({...current,jaquetteUrl:r.result}); r.readAsDataURL(f);
  });
  q(".act-logo").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ LOGOS[current.plateforme]={full:r.result}; units.forEach(u=>u.refreshBrand()); }; r.readAsDataURL(f);
  });

  render(game);
  return { root, render, refreshBrand:()=>{ renderBrand(); updateManual(); }, updateManual, close:requestClose };
}

function applyPlatform(root, code){
  const P=PLAT[code]; if(!P) return;
  const [W,H,T]=P.mm, s=root.style;
  root.dataset.family=P.family; root.dataset.clear=P.clear?"1":""; root.dataset.cart=P.cart||"";
  root.dataset.small=P.cmm && P.cmm[0]<50 ? "1" : "";
  const maxW = P.family==="carton" ? "calc((100vw - 56px) / 2.15)" : "calc((100vw - 48px) / 2.12)";
  s.setProperty("--w",`min(calc(var(--base) * ${f4(W/135)}), ${maxW})`);
  s.setProperty("--h",`calc(var(--w) * ${f4(H/W)})`);
  s.setProperty("--T",`calc(var(--w) * ${f4(T/W)})`);
  s.setProperty("--band-bg",P.band); s.setProperty("--band-ink",P.ink); s.setProperty("--band-logo",P.dark?"invert(1)":"none");
  if(P.cmm){ s.setProperty("--Cw",`calc(var(--w) * ${f4(P.cmm[0]/W)})`); s.setProperty("--Ch",`calc(var(--w) * ${f4(P.cmm[1]/W)})`); s.setProperty("--lfs",`calc(var(--w) * ${f4(Math.min(P.cmm[0],90)/W*.075)})`); }
  if(P.family==="carton"){
    s.setProperty("--box",P.box); s.setProperty("--p",P.acc); s.setProperty("--band-line",P.line||"rgba(255,255,255,.22)");
    const fw=W-6, fh=H-6;
    s.setProperty("--Fw",`calc(var(--w) * ${f4(fw/W)})`); s.setProperty("--Fh",`calc(var(--w) * ${f4(fh/W)})`);
    s.setProperty("--Mw",`calc(var(--w) * ${f4(fw*.93/W)})`); s.setProperty("--Mh",`calc(var(--w) * ${f4(fh*.93/W)})`);
  } else {
    s.setProperty("--p",P.p);
    s.setProperty("--sp",`calc(var(--w) * ${f4(Math.max(.06,T/W*.85))})`);
    s.setProperty("--r",`calc(var(--w) * ${P.r||.03})`);
    if(P.disc) s.setProperty("--disc",`calc(var(--w) * ${f4(.8*P.disc/120)})`);
    if(P.cy) s.setProperty("--cart-y",P.cy);
  }
}
