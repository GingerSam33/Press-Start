name: Base de jeux (MobyGames + IGDB)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plateformes a traiter (noms separes par des virgules, vide = rotation automatique)"
        required: false
        default: ''
      dry_run:
        description: "Test sans rien enregistrer (1 = oui)"
        required: false
        default: '0'

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Synchroniser la Base de jeux
        run: node robot/catalog-sync.mjs
        env:
          SUPABASE_URL: https://qsdkfewldohenndiftkb.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOBYGAMES_API_KEY: ${{ secrets.MOBYGAMES_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MOBY_MAX_REQ: '300'
